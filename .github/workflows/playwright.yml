name: Playwright

on:
  push:
    branches:
      - test-ci

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx playwright install

      - run: npx playwright test tests/CreateObject.spec.js